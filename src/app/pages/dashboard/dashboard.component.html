<div class="page">
  <h1>Panel de Control</h1>

  @if (loading()) {
    <p class="loading">Cargando resumen...</p>
  }

  @if (error()) {
    <p class="error">{{ error() }}</p>
  }

  @if (!loading() && !error()) {
    <div class="cards">
      <a routerLink="/products" class="card">
        <h2>{{ productCount() }}</h2>
        <p>Productos</p>
      </a>

      <a routerLink="/sales" class="card">
        <h2>{{ saleCount() }}</h2>
        <p>Ventas</p>
      </a>

      <a routerLink="/customers" class="card">
        <h2>{{ customerCount() }}</h2>
        <p>Clientes</p>
      </a>
    </div>
  }
</div>
