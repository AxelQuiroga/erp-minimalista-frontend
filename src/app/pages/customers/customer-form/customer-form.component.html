<h1>Nuevo Cliente</h1>

<form>
  <div class="form-group">
    <label for="name">Nombre</label>
    <input id="name" type="text" class="form-control" placeholder="Nombre del cliente">
  </div>

  <div class="form-group">
    <label for="email">Email</label>
    <input id="email" type="email" class="form-control" placeholder="correo@ejemplo.com">
  </div>

  <div class="form-group">
    <label for="phone">Teléfono</label>
    <input id="phone" type="tel" class="form-control" placeholder="+54 11 1234-5678">
  </div>

  <div class="form-group">
    <label for="address">Dirección</label>
    <input id="address" type="text" class="form-control" placeholder="Dirección">
  </div>

  <div class="form-actions">
    <button type="submit" class="btn btn-primary">Guardar</button>
    <a routerLink="/customers" class="btn btn-secondary">Cancelar</a>
  </div>
</form>
