<h1>Nuevo Producto</h1>

<form>
  <div class="form-group">
    <label for="name">Nombre</label>
    <input id="name" type="text" class="form-control" placeholder="Nombre del producto">
  </div>

  <div class="form-group">
    <label for="sku">SKU</label>
    <input id="sku" type="text" class="form-control" placeholder="Código único">
  </div>

  <div class="form-row">
    <div class="form-group">
      <label for="costPrice">Precio Costo</label>
      <input id="costPrice" type="number" class="form-control" placeholder="0.00">
    </div>

    <div class="form-group">
      <label for="salePrice">Precio Venta</label>
      <input id="salePrice" type="number" class="form-control" placeholder="0.00">
    </div>
  </div>

  <div class="form-actions">
    <button type="submit" class="btn btn-primary">Guardar</button>
    <a routerLink="/products" class="btn btn-secondary">Cancelar</a>
  </div>
</form>
