<div class="page">
  <h1>{{ pageTitle }}</h1>

  <form [formGroup]="form" (ngSubmit)="onSubmit()">

    <div class="form-group">
      <label for="name">Nombre</label>
      <input id="name" type="text" class="form-control" formControlName="name" placeholder="Nombre del producto">
    </div>

    <div class="form-group">
      <label for="sku">SKU</label>
      <input id="sku" type="text" class="form-control" formControlName="sku" placeholder="Código único">
    </div>

    <div class="form-group">
      <label for="categoryId">Categoría</label>
      <select id="categoryId" class="form-control" formControlName="categoryId">
        <option value="0" disabled>Seleccionar categoría...</option>
        @for (cat of categories(); track cat.id) {
          <option [value]="cat.id">{{ cat.name }}</option>
        }
      </select>
    </div>

    <div class="form-row">
      <div class="form-group">
        <label for="costPrice">Precio Costo</label>
        <input id="costPrice" type="number" class="form-control" formControlName="costPrice">
      </div>

      <div class="form-group">
        <label for="salePrice">Precio Venta</label>
        <input id="salePrice" type="number" class="form-control" formControlName="salePrice">
      </div>
    </div>

    <div class="form-group">
      <label for="currentStock">Stock Inicial</label>
      <input id="currentStock" type="number" class="form-control" formControlName="currentStock">
    </div>

    @if (error()) {
      <p class="error">{{ error() }}</p>
    }

    <div class="form-actions">
      <button type="submit" class="btn btn-primary" [disabled]="form.invalid || isSubmitting()">
        {{ isSubmitting() ? (isEditing ? 'Actualizando...' : 'Guardando...') : (isEditing ? 'Actualizar' : 'Guardar') }}
      </button>
      <a routerLink="/products" class="btn btn-secondary">Cancelar</a>
    </div>

  </form>
</div>
